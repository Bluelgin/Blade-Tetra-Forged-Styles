  <!-- Upper fragment: irregular silhouette and a torn, stepped lower edge. -->
  <path fill="#342b37" d="M9 2h8v1h6v1h3v4h-1v5h-1v3h-2v1h-3v-1h-2v2h-3v-1h-2v-2H9v1H7v-3H6V9h1V5h2z"/>
