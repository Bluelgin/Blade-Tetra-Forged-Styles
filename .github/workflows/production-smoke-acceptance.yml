name: One-time production smoke acceptance (remove after proof)

# Temporary initial validation of the optional test harness itself.
# REMOVE before this PR is considered merge-ready.
on:
  pull_request:
    branches: [fix/eventbus-subscriber-collisions-20261120]
    paths:
      - '.github/workflows/production-smoke-acceptance.yml'
      - 'tools/ci/production_smoke.py'
      - 'build.gradle'
      - 'src/main/java/dev/bladetetra/client/ProductionRendererSmoke.java'

permissions:
  contents: read

jobs:
  proof:
    if: github.head_ref == 'test/on-demand-production-client-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      MESA_GL_VERSION_OVERRIDE: '4.5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Produce real release JAR plus non-userdev dependencies
        run: ./gradlew --no-daemon stageProductionSmoke
      - name: Check release JAR
        run: python3 tools/ci/production_smoke.py --mode artifact
      - name: Install test launcher
        run: python3 -m pip install --disable-pip-version-check minecraft-launcher-lib==8.0
      - name: Launch real isolated Forge 47.4.13 client
        run: xvfb-run -a python3 tools/ci/production_smoke.py --mode client --forge 47.4.13 --timeout 480
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke-initial-proof
          path: |
            build/production-smoke/result.json
            build/production-smoke/launcher-run.log
            build/production-smoke/instance/logs/**
            build/production-smoke/instance/crash-reports/**
          if-no-files-found: warn
          retention-days: 7
