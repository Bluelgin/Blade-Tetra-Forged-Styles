name: Standalone Blade Receiver

on:
  pull_request:
  workflow_dispatch:
    inputs:
      slashblade:
        description: SlashBlade version for the isolated Forge receiving server
        required: true
        type: choice
        options:
          - '1.9.63'
          - '1.9.65'
        default: '1.9.63'

permissions:
  contents: read

concurrency:
  group: clean-blade-receiver-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  receiver:
    name: Clean Forge receiver / ${{ matrix.slashblade }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # On exporter PRs verify both supported SlashBlade builds independently.
        # Manual dispatch keeps a one-version targeted option.
        slashblade: ${{ github.event_name == 'pull_request' && fromJSON('["1.9.63","1.9.65"]') || fromJSON(format('["{0}"]', inputs.slashblade || '1.9.63')) }}
    env:
      SLASHBLADE_VERSION: ${{ matrix.slashblade }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate five independent sealed swords with server-side source mod
        run: |
          if [ "$SLASHBLADE_VERSION" = '1.9.65' ]; then
            python3 tools/ci/run_suite.py export_package_1965
          else
            python3 tools/ci/run_suite.py export_package
          fi
      - name: Bake Salty Fish and native fusion exports in the Forge client
        run: python3 tools/ci/run_suite.py export_client --slashblade "$SLASHBLADE_VERSION"
      - name: Compile and reobfuscate source-free receiving probe
        run: |
          if [ "$SLASHBLADE_VERSION" = '1.9.65' ]; then
            ./gradlew --no-daemon -Pslashblade1965 -PexportRuntimeProbe reobfExportRuntimeProbeJar
          else
            ./gradlew --no-daemon -PexportRuntimeProbe reobfExportRuntimeProbeJar
          fi
      - name: Install isolated Forge server and exercise generated standalone addons
        run: |
          python3 tools/ci/run_clean_receiver.py --slashblade "$SLASHBLADE_VERSION" \
            --salty-fish-jar build/blade-export-client-smoke/blade-exports/bt_export_salty_fish-*.jar \
            --fusion-jars build/blade-export-client-smoke/blade-exports/bt_export_fusion-*.jar \
              build/blade-export-client-smoke/blade-exports/bt_export_fusion_super-*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-blade-receiver-${{ matrix.slashblade }}
          path: |
            build/blade-export-package-smoke*/blade-exports/*.jar
            build/blade-export-client-smoke/blade-exports/*.jar
            build/blade-export-client-smoke/*.png
            build/blade-export-client-smoke.log
            build/clean-receiver/**/receiver.log
            build/clean-receiver/**/installer.log
            build/clean-receiver/**/logs/*.log
            build/export-runtime/bt-export-runtime-probe.jar
          retention-days: 14
