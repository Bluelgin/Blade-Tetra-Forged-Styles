name: One-shot maintenance transform

on:
  push:
    branches: [perf/runtime-hotpaths-and-maintenance]

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: perf/runtime-hotpaths-and-maintenance
          fetch-depth: 0

      - name: Apply bounded maintenance patches
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          challenge = Path("src/main/java/dev/bladetetra/challenge/ChallengeManager.java")
          text = challenge.read_text(encoding="utf-8")
          text = text.replace("mirrorAttacksCleaned", "mirrorRealmCleaned")
          old_tick_scan = '''        if (!mirrorRealmCleaned) {
              cleanupOrphanedAttacks(mirror);
              mirrorRealmCleaned = true;
          }
          if (mirror.getGameTime() % 20L == 0L) {
              List<MikageEntity> orphaned = new ArrayList<>();
              List<Entity> orphanedAttacks = new ArrayList<>();
              for (Entity entity : mirror.getAllEntities()) {
                  if (entity instanceof MikageEntity mikage
                          && !CHALLENGES.containsKey(mikage.getPersistentData()
                                  .getLong("blade_tetra_challenge"))) {
                      orphaned.add(mikage);
                  } else if (entity instanceof EntityAbstractSummonedSword sword
                          && sword.getOwner() == null) {
                      orphanedAttacks.add(sword);
                  }
              }
              orphaned.forEach(MikageEntity::discard);
              orphanedAttacks.forEach(Entity::discard);
          }
          '''
          new_tick_scan = '''        if (!mirrorRealmCleaned) {
              // Challenge sessions are intentionally process-local. Once both
              // protected levels are available, clean entities left by an old
              // server session exactly once instead of scanning the complete
              // mirror dimension every second for the rest of the uptime.
              cleanupOrphanedRealmEntities(mirror);
              mirrorRealmCleaned = true;
          }
          '''
          if text.count(old_tick_scan) != 1:
              raise SystemExit("ChallengeManager: recurring realm scan block changed unexpectedly")
          text = text.replace(old_tick_scan, new_tick_scan, 1)
          old_cleanup = '''    private static void cleanupOrphanedAttacks(ServerLevel mirror) {
          List<Entity> stale = new ArrayList<>();
          for (Entity entity : mirror.getAllEntities()) {
              if (entity instanceof EntityAbstractSummonedSword sword
                      && (sword.getOwner() == null
                              || sword.getPersistentData().getBoolean(
                                      "blade_tetra_mikage_attack"))) {
                  stale.add(sword);
              }
          }
          stale.forEach(Entity::discard);
      }
          '''
          new_cleanup = '''    private static void cleanupOrphanedRealmEntities(ServerLevel mirror) {
          List<Entity> stale = new ArrayList<>();
          for (Entity entity : mirror.getAllEntities()) {
              if (entity instanceof MikageEntity) {
                  // CHALLENGES is reset for every server process, so a loaded
                  // Mikage at this point can only belong to an old session.
                  stale.add(entity);
              } else if (entity instanceof EntityAbstractSummonedSword sword
                      && (sword.getOwner() == null
                              || sword.getPersistentData().getBoolean(
                                      "blade_tetra_mikage_attack"))) {
                  stale.add(sword);
              }
          }
          stale.forEach(Entity::discard);
      }
          '''
          if text.count(old_cleanup) != 1:
              raise SystemExit("ChallengeManager: startup cleanup method changed unexpectedly")
          text = text.replace(old_cleanup, new_cleanup, 1)
          challenge.write_text(text, encoding="utf-8")

          material = Path("src/main/java/dev/bladetetra/client/MaterialTextureManager.java")
          text = material.read_text(encoding="utf-8")
          field_anchor = '''    private static final ThreadLocal<Boolean> RENDERING_INTERNAL_PASS =
              ThreadLocal.withInitial(() -> false);
          private static final Palette RAYSKIN_PALETTE =
          '''
          field_replacement = '''    private static final ThreadLocal<Boolean> RENDERING_INTERNAL_PASS =
              ThreadLocal.withInitial(() -> false);
          /** Immutable 256px source for per-signature working copies during one resource cycle. */
          private static NativeImage GENERATED_ATLAS_TEMPLATE;
          private static final Palette RAYSKIN_PALETTE =
          '''
          if text.count(field_anchor) != 1:
              raise SystemExit("MaterialTextureManager: template field anchor changed unexpectedly")
          text = text.replace(field_anchor, field_replacement, 1)

          direct_load = '''            Resource resource = minecraft.getResourceManager()
                  .getResourceOrThrow(TEMPLATE);
              NativeImage image = loadGeneratedAtlas(resource);
          '''
          if text.count(direct_load) != 2:
              raise SystemExit(f"MaterialTextureManager: expected two direct template loads, found {text.count(direct_load)}")
          text = text.replace(direct_load,
              '''            NativeImage image = copyGeneratedAtlas(
                  minecraft.getResourceManager());
          ''')

          helper_anchor = '''    /**
       * Resamples the authored 512px source atlas into the 256px runtime atlas.
          '''
          helper = '''    private static synchronized NativeImage copyGeneratedAtlas(
              ResourceManager resourceManager) throws IOException {
          if (GENERATED_ATLAS_TEMPLATE == null) {
              Resource resource = resourceManager.getResourceOrThrow(TEMPLATE);
              GENERATED_ATLAS_TEMPLATE = loadGeneratedAtlas(resource);
          }
          NativeImage copy = new NativeImage(
                  GENERATED_ATLAS_SIZE,
                  GENERATED_ATLAS_SIZE,
                  true);
          copy.copyFrom(GENERATED_ATLAS_TEMPLATE);
          return copy;
      }

      /**
       * Resamples the authored 512px source atlas into the 256px runtime atlas.
          '''
          if text.count(helper_anchor) != 1:
              raise SystemExit("MaterialTextureManager: atlas helper anchor changed unexpectedly")
          text = text.replace(helper_anchor, helper, 1)

          clear_anchor = '''        DURABILITY_BASE_CACHE.clear();
          LegacyModelPartRenderer.clear();
          '''
          clear_replacement = '''        DURABILITY_BASE_CACHE.clear();
          if (GENERATED_ATLAS_TEMPLATE != null) {
              GENERATED_ATLAS_TEMPLATE.close();
              GENERATED_ATLAS_TEMPLATE = null;
          }
          LegacyModelPartRenderer.clear();
          '''
          if text.count(clear_anchor) != 1:
              raise SystemExit("MaterialTextureManager: clearCache anchor changed unexpectedly")
          text = text.replace(clear_anchor, clear_replacement, 1)
          material.write_text(text, encoding="utf-8")

          config = Path("CONFIGURATION.md")
          config_text = config.read_text(encoding="utf-8")
          old_config = "Brightness of boundary seals, spectral torii and mirror walls."
          new_config = "Brightness of the geometric mirror-realm boundary rings."
          if config_text.count(old_config) != 1:
              raise SystemExit("CONFIGURATION.md: Mikage boundary description changed unexpectedly")
          config.write_text(config_text.replace(old_config, new_config, 1), encoding="utf-8")

      - name: Validate transformed sources
        run: ./gradlew build

      - name: Commit validated maintenance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/maintenance-transform.yml
          git add src/main/java/dev/bladetetra/challenge/ChallengeManager.java \
                  src/main/java/dev/bladetetra/client/MaterialTextureManager.java \
                  CONFIGURATION.md
          git commit -m "Optimize challenge cleanup and material atlas generation"
          git push origin HEAD:perf/runtime-hotpaths-and-maintenance
