name: Production JAR smoke (manual)

# Deliberately opt-in: this is a true release-JAR Forge launch, not the
# ForgeGradle runClient userdev profile. No push/PR/schedule triggers.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'artifact: inspect JAR only; client: launch a real Forge GUI and verify renderers'
        required: true
        type: choice
        options: [client, artifact]
        default: client
      forge_version:
        description: 'Player-compatible Forge version'
        required: true
        type: choice
        options: ['47.4.13', '47.4.23']
        default: '47.4.13'

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packaged-client:
    name: Packaged ${{ inputs.mode }} / Forge ${{ inputs.forge_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      MESA_GL_VERSION_OVERRIDE: '4.5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build reobfuscated release JAR and stage original runtime dependencies
        run: ./gradlew --no-daemon stageProductionSmoke
      - name: Verify release JAR contents and single-mod isolation
        run: python3 tools/ci/production_smoke.py --mode artifact --forge '${{ inputs.forge_version }}'
      - name: Install isolated client launch helper (only for full client mode)
        if: inputs.mode == 'client'
        run: python3 -m pip install --disable-pip-version-check minecraft-launcher-lib==8.0
      - name: Boot real Forge GUI, validate entity renderers and reach menu
        if: inputs.mode == 'client'
        run: xvfb-run -a python3 tools/ci/production_smoke.py --mode client --forge '${{ inputs.forge_version }}' --timeout 480
      - name: Attach audit report and real-client logs, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ inputs.mode }}-${{ inputs.forge_version }}
          path: |
            build/production-smoke/result.json
            build/production-smoke/launcher-run.log
            build/production-smoke/instance/logs/**
            build/production-smoke/instance/crash-reports/**
          if-no-files-found: warn
          retention-days: 14
