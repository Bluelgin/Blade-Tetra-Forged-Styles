name: Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope (compat includes full base validation)
        type: choice
        options: [auto, full, compat]
        default: full

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan validation
    runs-on: ubuntu-latest
    outputs:
      quick: ${{ steps.plan.outputs.quick }}
      native: ${{ steps.plan.outputs.native }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select suites and explain coverage
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          MODE: ${{ inputs.scope || 'auto' }}
        run: |
          python3 tools/ci/plan.py --base "$BASE" --head "$GITHUB_SHA" --mode "$MODE" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" || \
          python3 tools/ci/plan.py --mode full --reason 'Planner failed; full fallback' \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: validation-plan
          path: build/ci-plan.json

  quick:
    name: Build and unit tests
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test suite-selection boundaries
        run: |
          python3 -m unittest discover -s tools/ci -p 'test_*.py'
          python3 tools/ci/check_resources.py
      - uses: actions/setup-java@v4
        if: needs.plan.outputs.quick == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: needs.plan.outputs.quick == 'true'
      - name: Compile production and development tools; test; verify release JAR
        if: needs.plan.outputs.quick == 'true'
        run: ./gradlew build integrationTestClasses verifyProductionJar kyoukaNativeApiAudit
      - uses: actions/upload-artifact@v4
        if: always() && needs.plan.outputs.quick == 'true'
        with:
          name: build-and-unit-evidence
          path: |
            build/libs/*.jar
            build/test-results/test/*.xml
            build/kyouka-native-api.txt
          retention-days: 14

  native:
    name: Native / ${{ matrix.suite }}
    needs: [plan, quick]
    if: needs.plan.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run isolated suite and verify proof markers
        run: python3 tools/ci/run_suite.py '${{ matrix.suite }}' ${{ matrix.audit_suite && format('--audit-suite {0}', matrix.audit_suite) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.suite }}
          path: |
            build/*.log
            build/*/logs/**
            build/*/*.png
            build/*/evidence/**
          retention-days: 14

  gate:
    name: Validation gate
    needs: [plan, quick, native]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected checks, including cancellation/failure reporting
        env:
          PLAN: ${{ needs.plan.result }}
          QUICK: ${{ needs.quick.result }}
          NATIVE: ${{ needs.native.result }}
          EXPECT_NATIVE: ${{ needs.plan.outputs.native }}
        run: |
          test "$PLAN" = success
          test "$QUICK" = success
          if [ "$EXPECT_NATIVE" = true ]; then
            test "$NATIVE" = success
          else
            test "$EXPECT_NATIVE" = false
            test "$NATIVE" = skipped
          fi
